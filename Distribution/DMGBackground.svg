<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Goalong History disk image background</title>
  <desc id="desc">A clean installer background directing the user to drag Goalong History into Applications.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101712"/>
      <stop offset=".5" stop-color="#0d140f"/>
      <stop offset="1" stop-color="#0b100d"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="880" fill="url(#surface)"/>
  <rect x="108" y="76" width="68" height="68" rx="18" fill="#1b251e"/>
  <path transform="translate(119 92) scale(1.7692)" d="M2.08 9 C2.08 1.8 9.62 1.44 13.26 9 C16.64 16.56 23.92 16.2 23.92 9 C23.92 1.8 16.64 1.44 13.26 9 C9.62 16.56 2.08 16.2 2.08 9 M2.08 9 H10.14 C11.44 9 12.74 9.72 12.74 10.62" fill="none" stroke="#d3f35f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="132" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="58" font-weight="700" fill="#f2f6ef">Goalong History</text>
  <text x="200" y="174" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" fill="#a0b0a4">Private, verifiable activity for your Mac</text>
  <text x="720" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" font-weight="500" fill="#c0ccc2">Drag Goalong History to Applications</text>
  <circle cx="360" cy="475" r="128" fill="#1b251e" fill-opacity=".8" stroke="#506455" stroke-opacity=".18" stroke-width="3"/>
  <circle cx="1080" cy="475" r="128" fill="#1b251e" fill-opacity=".8" stroke="#506455" stroke-opacity=".18" stroke-width="3"/>
  <path d="M555 475h310" stroke="#d3f35f" stroke-width="8" stroke-linecap="round"/>
  <path d="m865 475-44-29v58z" fill="#d3f35f"/>
  <g font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="19" font-weight="600" fill="#c0ccc2">
    <rect x="225" y="704" width="275" height="54" rx="27" fill="#1b251e" fill-opacity=".86" stroke="#506455" stroke-opacity=".14"/>
    <text x="247" y="738">Local activity history</text>
    <rect x="520" y="704" width="278" height="54" rx="27" fill="#1b251e" fill-opacity=".86" stroke="#506455" stroke-opacity=".14"/>
