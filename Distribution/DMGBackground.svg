    <rect x="818" y="704" width="397" height="54" rx="27" fill="#1b251e" fill-opacity=".86" stroke="#506455" stroke-opacity=".14"/>
    <text x="840" y="738">Native macOS workspace</text>
  </g>
  <text x="720" y="822" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="21" fill="#a0b0a4">Open Goalong History after copying it — the setup assistant will guide every permission step.</text>
