name: Continuous Community macOS release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: goalong-history-latest-main
  cancel-in-progress: true

jobs:
  publish-latest-main:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PRODUCT: Goalong History
      DISPLAY_NAME: Goalong History
      BUNDLE_ID: ai.goalong.localhistory
      ROLLING_TAG: latest-main
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve rolling version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/resolve_rolling_version.sh "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build universal Community app
        env:
          LOCALHISTORY_VERSION: ${{ steps.version.outputs.value }}
          LOCALHISTORY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LOCALHISTORY_DISPLAY_NAME: Goalong History
          LOCALHISTORY_ARCHS: arm64 x86_64
          LOCALHISTORY_RUN_TESTS: 1
          LOCALHISTORY_CODESIGN_IDENTITY: '-'
        run: ./scripts/build_app.sh

      - name: Verify architecture, ad-hoc signature, identity, and privacy policy
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
          LOCALHISTORY_REQUIRE_LOCALIZED_NAME: 1
          LOCALHISTORY_DISPLAY_NAME: Goalong History
        run: |
          set -euo pipefail
          APP="dist/Goalong History.app"
          INFO="$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/Goalong History"
          lipo "$APP/Contents/MacOS/Goalong History" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=4 "$APP"
          SIGNING_DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          grep -Fxq 'Signature=adhoc' <<<"$SIGNING_DETAILS"
          if grep -q '^Authority=' <<<"$SIGNING_DETAILS"; then
            echo "Community releases must not depend on a certificate-backed Apple identity." >&2
            exit 1
          fi
          if spctl --assess --type execute "$APP" >/dev/null 2>&1; then
            echo "Community releases must not be presented as Apple-notarized builds." >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")" = "$PRODUCT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")" = "$PRODUCT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "$EXPECTED_BUILD"
          for locale in en fr; do
            STRINGS="$APP/Contents/Resources/$locale.lproj/InfoPlist.strings"
            test "$(plutil -extract CFBundleDisplayName raw -o - "$STRINGS")" = "$DISPLAY_NAME"
            test "$(plutil -extract CFBundleName raw -o - "$STRINGS")" = "$DISPLAY_NAME"
          done
          ./scripts/verify_local_bundle.sh

      - name: Create Community DMG and ZIP
        run: |
          set -euo pipefail
          brew install create-dmg
          LOCALHISTORY_CODESIGN_IDENTITY=- ./scripts/package_release.sh

      - name: Generate auditable release inventory
        run: |
          python3 scripts/generate_security_artifacts.py \
            --app "dist/Goalong History.app" \
            --edition unified \
            --output-dir dist \
            --include-release-artifacts
          python3 scripts/verify_security_capabilities.py \
            --manifest dist/security-capabilities.json \
            --app "dist/Goalong History.app" \
            --edition unified

      - name: Attest Community release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Move rolling tag to this merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force "$ROLLING_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ROLLING_TAG" --force

      - name: Remove retired rolling-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            retired_assets=(
              appcast.xml
              LocalHistory-macOS-universal.dmg
              LocalHistory-macOS-universal.dmg.sha256
              LocalHistory-macOS-universal.zip
              LocalHistory-macOS-universal.zip.sha256
            )
            for asset in "${retired_assets[@]}"; do
              gh release delete-asset "$ROLLING_TAG" "$asset" --yes >/dev/null 2>&1 || true
            done
          fi

      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: latest-main
          name: Goalong History ${{ steps.version.outputs.value }} Community Build — latest main
          body: |
            Goalong History `${{ steps.version.outputs.value }}` (build `${{ steps.version.outputs.build }}`), built from `${{ github.sha }}` on `main`.

            This is the single free Community Build. It is ad-hoc code signed for bundle-integrity checks, but it is not Apple-notarized and does not require a paid Apple Developer membership. On first launch, macOS may require **System Settings → Privacy & Security → Open Anyway**. Never disable Gatekeeper globally.

            Verify the downloaded SHA-256 file and `release-manifest.json`. GitHub also publishes a Sigstore-backed build-provenance attestation; with GitHub CLI, run `gh attestation verify <downloaded-file> --repo blancmathis/goalong-history`.

            Updates are manual. Because a free ad-hoc signature has no stable Apple-issued identity, macOS may ask for Goalong permissions again after replacement. Existing history and settings remain in place.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          preserve_order: true
          files: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json
