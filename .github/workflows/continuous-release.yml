name: Continuous Sparkle macOS release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalong-history-latest-main
  cancel-in-progress: true

jobs:
  publish-latest-main:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PRODUCT: Goalong History
      DISPLAY_NAME: Goalong History
      BUNDLE_ID: ai.goalong.localhistory
      ROLLING_TAG: latest-main
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve rolling version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/resolve_rolling_version.sh "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve release trust mode
        id: release_mode
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          sparkle_missing=()
          for name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY; do
            if [[ -z "${!name:-}" ]]; then
              sparkle_missing+=("$name")
            fi
          done
          if (( ${#sparkle_missing[@]} > 0 )); then
            printf 'Missing required Sparkle release value: %s\n' "${sparkle_missing[@]}" >&2
            echo "The rolling updater fails closed unless its EdDSA signing pair is configured." >&2
            exit 1
          fi

          apple_values=(
            MACOS_CERTIFICATE_P12
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_API_PRIVATE_KEY
          )
          apple_configured=0
          apple_missing=()
          for name in "${apple_values[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              apple_configured=$((apple_configured + 1))
            else
              apple_missing+=("$name")
            fi
          done

          if (( apple_configured == 0 )); then
            echo "apple_enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_note=This build is ad-hoc code signed. Its update archive and feed are authenticated with Sparkle EdDSA; macOS may require a one-time manual approval on first install." >> "$GITHUB_OUTPUT"
            echo "### Release trust mode: Sparkle EdDSA (free mode)" >> "$GITHUB_STEP_SUMMARY"
          elif (( apple_configured == ${#apple_values[@]} )); then
            echo "apple_enabled=true" >> "$GITHUB_OUTPUT"
            echo "release_note=This build is Developer ID signed and notarized by Apple. Its update archive and feed are also authenticated with Sparkle EdDSA." >> "$GITHUB_OUTPUT"
            echo "### Release trust mode: Developer ID + notarization + Sparkle EdDSA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Incomplete optional Apple release configuration; missing: %s\n' "${apple_missing[@]}" >&2
            echo "Configure every Apple value or remove all of them to use the free Sparkle-only mode." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ steps.release_mode.outputs.apple_enabled == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/goalong-history-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/goalong-history-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$P12_PATH"
          chmod 600 "$P12_PATH"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGNING_P12_PATH=$P12_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          DEVELOPER_ID_COUNT="$(printf '%s\n' "$IDENTITIES" | awk '/"Developer ID Application:/{count++} END {print count+0}')"
          if [[ "$DEVELOPER_ID_COUNT" != "1" ]]; then
            echo "The imported P12 must contain exactly one valid Developer ID Application identity; found $DEVELOPER_ID_COUNT." >&2
            exit 1
          fi
          SIGN_IDENTITY="$(printf '%s\n' "$IDENTITIES" | sed -nE 's/^[[:space:]]*[0-9]+\) [[:xdigit:]]+ "(Developer ID Application: [^"]+)"$/\1/p')"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "Could not determine the Developer ID Application identity from the imported P12." >&2
            exit 1
          fi
          echo "LOCALHISTORY_CODESIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          /bin/rm -P "$P12_PATH"

      - name: Prepare App Store Connect API key
        if: ${{ steps.release_mode.outputs.apple_enabled == 'true' }}
        env:
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" | /usr/bin/base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate App Store Connect notarization credentials
        if: ${{ steps.release_mode.outputs.apple_enabled == 'true' }}
        env:
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" >/dev/null

      - name: Build universal update-enabled app
        env:
          LOCALHISTORY_VERSION: ${{ steps.version.outputs.value }}
          LOCALHISTORY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LOCALHISTORY_DISPLAY_NAME: Goalong History
          LOCALHISTORY_ARCHS: arm64 x86_64
          LOCALHISTORY_RUN_TESTS: 1
          LOCALHISTORY_SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/build_app.sh

      - name: Confirm architecture, identity, localized name, code signature, and updater policy
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_BUILD: ${{ steps.version.outputs.build }}
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: 1
          LOCALHISTORY_REQUIRE_LOCALIZED_NAME: 1
          LOCALHISTORY_DISPLAY_NAME: Goalong History
        run: |
          set -euo pipefail
          APP="dist/Goalong History.app"
          INFO="$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/Goalong History"
          lipo "$APP/Contents/MacOS/Goalong History" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=4 "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")" = "$PRODUCT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")" = "$PRODUCT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "$EXPECTED_BUILD"
          for locale in en fr; do
            STRINGS="$APP/Contents/Resources/$locale.lproj/InfoPlist.strings"
            test "$(plutil -extract CFBundleDisplayName raw -o - "$STRINGS")" = "$DISPLAY_NAME"
            test "$(plutil -extract CFBundleName raw -o - "$STRINGS")" = "$DISPLAY_NAME"
          done
          ./scripts/verify_sparkle_bundle.sh

      - name: Notarize and staple app
        if: ${{ steps.release_mode.outputs.apple_enabled == 'true' }}
        env:
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "dist/Goalong History.app" "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/Goalong History.app"
          xcrun stapler validate "dist/Goalong History.app"
          spctl --assess --type execute --verbose=4 "dist/Goalong History.app"

      - name: Create DMG and ZIP
        run: |
          set -euo pipefail
          brew install create-dmg
          ./scripts/package_release.sh

      - name: Notarize and staple DMG
        if: ${{ steps.release_mode.outputs.apple_enabled == 'true' }}
        env:
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="dist/Goalong-History-macOS-universal.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          (
            cd dist
            shasum -a 256 Goalong-History-macOS-universal.dmg > Goalong-History-macOS-universal.dmg.sha256
            shasum -a 256 Goalong-History-macOS-universal.zip > Goalong-History-macOS-universal.zip.sha256
          )

      - name: Generate signed rolling Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          ./scripts/generate_sparkle_appcast.sh \
            "${{ steps.version.outputs.value }}" \
            dist/Goalong-History-macOS-universal.zip \
            dist/appcast.xml \
            "$ROLLING_TAG"
          test -s dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast.xml
          grep -Fq "/releases/download/$ROLLING_TAG/Goalong-History-macOS-universal.zip" dist/appcast.xml
          grep -Fq "<sparkle:shortVersionString>${{ steps.version.outputs.value }}</sparkle:shortVersionString>" dist/appcast.xml
          grep -Fq "<sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>" dist/appcast.xml

      - name: Move rolling tag to this merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force "$ROLLING_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ROLLING_TAG" --force

      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-main
          name: Goalong History ${{ steps.version.outputs.value }} — latest main
          body: |
            Goalong History `${{ steps.version.outputs.value }}` (build `${{ steps.version.outputs.build }}`), automatically built and published from `${{ github.sha }}` on `main`.

            ${{ steps.release_mode.outputs.release_note }}

            Installed update-enabled builds discover this release through Sparkle. The rolling tag and assets are intentionally replaced after every successful merge.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          preserve_order: true
          files: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/appcast.xml

      - name: Remove temporary credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${NOTARY_KEY_PATH:-}" && -f "$NOTARY_KEY_PATH" ]]; then
            chmod 600 "$NOTARY_KEY_PATH"
            /bin/rm -P "$NOTARY_KEY_PATH"
          fi
          if [[ -n "${SIGNING_P12_PATH:-}" && -f "$SIGNING_P12_PATH" ]]; then
            chmod 600 "$SIGNING_P12_PATH"
            /bin/rm -P "$SIGNING_P12_PATH"
          fi
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -e "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
            if [[ -e "$SIGNING_KEYCHAIN" ]]; then
              chmod 600 "$SIGNING_KEYCHAIN"
              /bin/rm -P "$SIGNING_KEYCHAIN"
            fi
          fi
