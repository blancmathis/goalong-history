name: Continuous Community macOS release
run-name: ${{ github.event_name == 'push' && format('Publish main {0}', github.sha) || inputs.signed_stage && format('Publish {0}', inputs.signed_stage) || 'Manual Community release' }}

on:
  # The exact-main run: promote the prepared PR candidate, or build in full as fallback.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_stage:
        description: Optional release staging tag for an already certificate-signed local build
        type: string
        required: false
      local_gates:
        description: Reuse only independently verified successful same-tree hosted gates
        type: boolean
        default: false
      signed_sha256:
        description: SHA-256 of the explicitly supplied signed ZIP
        type: string
        required: false

# Whole runs are serialized. A pending run is replaced only by a newer run, so the
# newest main commit is always published and a deferred-delta job of an older run
# can no longer cancel a pending main publication in the job-level writer group.
concurrency:
  group: goalong-history-main-publication
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read
  checks: read
  pull-requests: read

jobs:
  promote-prepared:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    concurrency:
      group: goalong-history-feed-writer
      cancel-in-progress: false
    outputs:
      result: ${{ steps.admit.outputs.result }}
      tag: ${{ steps.admit.outputs.tag }}
    env:
      GODEBUG: http2client=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Admit the prepared candidate for this exact main tree
        id: admit
        run: python3 scripts/promote_prepared_release.py admit

      - name: Attest final release provenance at the exact main commit
        if: steps.admit.outputs.result == 'admitted'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/community-appcast.xml
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Publish immutable release, then the authenticated feed last
        if: steps.admit.outputs.result == 'admitted'
        run: python3 scripts/promote_prepared_release.py publish

      - name: Attest actual public verification
        if: steps.admit.outputs.result == 'admitted'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/public-verification.json

      - name: Publish attested public verification receipt
        if: steps.admit.outputs.result == 'admitted'
        run: gh release upload "${{ steps.admit.outputs.tag }}" dist/public-verification.json dist/promotion-timings.json

      - name: Retain full generation for deferred deltas
        if: steps.admit.outputs.result == 'admitted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Full-${{ github.run_id }}
          path: |
            dist/Goalong-History-macOS-universal.zip
            dist/community-appcast.xml
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json
          retention-days: 3

  signing-plan:
    needs: promote-prepared
    if: always() && (github.event_name == 'workflow_dispatch' || needs.promote-prepared.outputs.result == 'fallback')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - id: plan
        env:
          HAS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 != '' }}
          HAS_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD != '' }}
          SIGNED_STAGE: ${{ inputs.signed_stage }}
        run: |
          if [[ -n "$SIGNED_STAGE" ]]; then
            echo 'mode=supplied' >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_CERTIFICATE" == true && "$HAS_PASSWORD" == true ]]; then
            echo 'mode=hosted' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=local' >> "$GITHUB_OUTPUT"
            echo 'Preparing a tested universal archive for local signature. No public signing downgrade or developer-key export.' >> "$GITHUB_STEP_SUMMARY"
          fi
  prepare-local-signature:
    needs: signing-plan
    if: always() && needs.signing-plan.result == 'success' && needs.signing-plan.outputs.mode == 'local'
    uses: ./.github/workflows/prepare-local-signed-release.yml
    secrets: inherit
  publish-latest-main:
    needs: signing-plan
    if: always() && needs.signing-plan.result == 'success' && needs.signing-plan.outputs.mode != 'local'
    runs-on: macos-15
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    timeout-minutes: 80
    concurrency:
      group: goalong-history-feed-writer
      cancel-in-progress: false
    env:
      # Bound the GitHub CLI large-asset transport to HTTP/1.1; TLS and signature checks remain mandatory.
      GODEBUG: http2client=0
      PRODUCT: Goalong History
      DISPLAY_NAME: Goalong History
      BUNDLE_ID: ai.goalong.localhistory
      ROLLING_TAG: latest-main
      IMMUTABLE_TAG: main-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require update signing credentials
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY || vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PRIVATE_ED_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required update signing value: $name" >&2
              exit 1
            fi
          done

      - name: Prepare stable code-signing identity
        if: inputs.signed_stage == ''
        env:
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/import_release_signing_identity.sh

      - name: Validate explicitly supplied local signature
        if: inputs.signed_stage != ''
        env:
          SIGNED_STAGE: ${{ inputs.signed_stage }}
          SIGNED_SHA256: ${{ inputs.signed_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_presigned_release.py "$SIGNED_STAGE" "$SIGNED_SHA256"

      - name: Test source for supplied build
        if: inputs.signed_stage != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test_permission_requirement_policy.py
          if [[ "${{ inputs.local_gates }}" == true ]]; then
            python3 scripts/local_deploy_policy.py "$GITHUB_SHA" "$RUNNER_TEMP/source-gates.json"
          else
            mkdir -p "$RUNNER_TEMP/goalong-test-home"
            GOALONG_TEST_HOME="$RUNNER_TEMP/goalong-test-home" CFFIXED_USER_HOME="$RUNNER_TEMP/goalong-test-home" xcrun swift test
          fi
          bash scripts/audit_privacy_boundaries.sh
          bash scripts/test_release_signing_policy.sh

      - name: Resolve rolling version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "dist/Goalong History.app/Contents/Info.plist" ]]; then
            INFO="dist/Goalong History.app/Contents/Info.plist"
            echo "value=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" >> "$GITHUB_OUTPUT"
            echo "build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" >> "$GITHUB_OUTPUT"
          else
            ./scripts/resolve_rolling_version.sh "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal Community app
        if: inputs.signed_stage == ''
        env:
          LOCALHISTORY_VERSION: ${{ steps.version.outputs.value }}
          LOCALHISTORY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LOCALHISTORY_DISPLAY_NAME: Goalong History
          LOCALHISTORY_ARCHS: arm64 x86_64
          LOCALHISTORY_APP_ENTITLEMENTS: Distribution/GoalongHistory.entitlements
          LOCALHISTORY_RUN_TESTS: 1
          LOCALHISTORY_CODESIGN_IDENTITY: ${{ env.LOCALHISTORY_CODESIGN_IDENTITY }}
          LOCALHISTORY_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY || vars.SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/build_app.sh

      - name: Verify architecture, stable signature, identity, and privacy policy
        run: bash scripts/verify_release_bundle.sh "dist/Goalong History.app" "${{ steps.version.outputs.value }}" "${{ steps.version.outputs.build }}"

      - name: Package DMG and generate authenticated Community appcast
        env:
          SIGNED_ARCHIVE_HASH: ${{ inputs.signed_sha256 }}
          LOCALHISTORY_PACKAGE_STANDARD_DMG: 1
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          LOCALHISTORY_DELTA_BASES_DIR: ''
          VERSION_NAME: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, os, subprocess, time
          def execute(name, argv, env):
              start = time.monotonic()
              result = subprocess.run(argv, env=env)
              print(f"{name}: {time.monotonic()-start:.3f} seconds, exit {result.returncode}", flush=True)
              return result.returncode
          if os.environ.get('SIGNED_ARCHIVE_HASH'):
              os.environ['LOCALHISTORY_VERIFIED_ZIP_SHA256'] = os.environ['SIGNED_ARCHIVE_HASH']
          package_env = dict(os.environ)
          package_env.pop('LOCALHISTORY_CODESIGN_IDENTITY', None)
          commands = [('package', ['bash', 'scripts/package_release.sh'], package_env),
                      ('appcast', ['bash', 'scripts/generate_sparkle_appcast.sh', os.environ['VERSION_NAME'],
                       'dist/Goalong-History-macOS-universal.zip', 'dist/community-appcast.xml', os.environ['IMMUTABLE_TAG']], dict(os.environ))]
          if os.environ.get('LOCALHISTORY_VERIFIED_ZIP_SHA256'):
              # The validated ZIP is immutable; these stages write separate outputs.
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  futures = [pool.submit(execute, *command) for command in commands]
                  statuses = [future.result() for future in futures]
          else:
              statuses = []
              for command in commands:
                  statuses.append(execute(*command))
                  if statuses[-1]: break
          assert not any(statuses), f'Packaging/appcast failed: {statuses}'
          PY
          grep -Fq "<sparkle:version>${{ steps.version.outputs.build }}</sparkle:version>" dist/community-appcast.xml

      - name: Generate auditable release inventory
        run: |
          python3 scripts/generate_security_artifacts.py \
            --app "dist/Goalong History.app" \
            --edition unified \
            --output-dir dist \
            --include-release-artifacts
          python3 scripts/verify_security_capabilities.py \
            --manifest dist/security-capabilities.json \
            --app "dist/Goalong History.app" \
            --edition unified

      - name: Attest Community release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/community-appcast.xml
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Refuse to publish a superseded or non-main commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$REMOTE_MAIN" != "$GITHUB_SHA" ]]; then
            echo "This run has been superseded by another main commit; refusing to replace the update feed." >&2
            exit 1
          fi

      - name: Require monotonic authenticated release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/authenticated_release_state.py "$RUNNER_TEMP/previous-public" "dist/Goalong History.app/Contents/Info.plist"

      - name: Publish immutable update archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An old feed must remain usable while latest-main assets are being replaced.
          # Never clobber these archives or use latest-main ZIP URLs in the appcast.
          # Deferred deltas will live next to this unchanged immutable ZIP.
          shopt -s nullglob
          deltas=(dist/Goalong-History-macOS-universal-from-*.delta)
          gh release create "$IMMUTABLE_TAG" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Goalong History ${{ steps.version.outputs.value }} — build ${{ steps.version.outputs.build }}" \
            --notes "Authenticated Community update archive for $GITHUB_SHA. Stable certificate-backed identity; not Apple-notarized." \
            dist/Goalong-History-macOS-universal.zip \
            dist/Goalong-History-macOS-universal.zip.sha256 \
            dist/security-capabilities.json dist/sbom.spdx.json dist/release-manifest.json \
            ${deltas[@]+"${deltas[@]}"}

      - name: Remove retired rolling-release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            retired_assets=(
              appcast.xml
              LocalHistory-macOS-universal.dmg
              LocalHistory-macOS-universal.dmg.sha256
              LocalHistory-macOS-universal.zip
              LocalHistory-macOS-universal.zip.sha256
            )
            for asset in "${retired_assets[@]}"; do
              gh release delete-asset "$ROLLING_TAG" "$asset" --yes >/dev/null 2>&1 || true
            done
          fi

      - name: Render rolling release notes
        run: python3 scripts/render_rolling_notes.py "${{ steps.version.outputs.value }}" "${{ steps.version.outputs.build }}" "$GITHUB_SHA" "$RUNNER_TEMP/rolling-notes.md"

      - name: Recheck main before the rolling assets and manifest are replaced
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: latest-main
          name: Goalong History ${{ steps.version.outputs.value }} Community Build — latest main
          body_path: ${{ runner.temp }}/rolling-notes.md
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          preserve_order: true
          files: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Publish authenticated feed last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Revalidate under the sole feed-writer lock, immediately before mutation.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/authenticated_release_state.py "$RUNNER_TEMP/current-public" "dist/Goalong History.app/Contents/Info.plist"
          gh release upload "$ROLLING_TAG" dist/community-appcast.xml --clobber
          LOCALHISTORY_PUBLIC_RECEIPT=dist/public-verification.json bash scripts/verify_published_update.sh dist
          git tag --force "$ROLLING_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$ROLLING_TAG" --force
          echo "Published signed update ${{ steps.version.outputs.value }} (${{ steps.version.outputs.build }}) from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest actual public verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/public-verification.json
      - name: Publish attested public verification receipt
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$IMMUTABLE_TAG" dist/public-verification.json
          echo "tag=$IMMUTABLE_TAG" >> "$GITHUB_OUTPUT"

      - name: Retain full generation for deferred deltas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Full-${{ github.run_id }}
          path: |
            dist/Goalong-History-macOS-universal.zip
            dist/community-appcast.xml
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json
          retention-days: 3

      - name: Remove temporary signing keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/goalong-release-signing.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/goalong-release-signing.p12"

  prepare-deltas:
    needs: [promote-prepared, publish-latest-main]
    if: always() && (needs.promote-prepared.outputs.result == 'admitted' && needs.promote-prepared.result == 'success' || needs.publish-latest-main.result == 'success')
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.deltas.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      GODEBUG: http2client=0
      RELEASE_TAG: ${{ needs.promote-prepared.outputs.tag || needs.publish-latest-main.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Goalong-Full-${{ github.run_id }}
          path: dist
      - name: Prepare authenticated and applied deltas outside writer lock
        id: deltas
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: python3 scripts/deferred_release_deltas.py prepare "$RELEASE_TAG"
      - name: Attest enriched generation
        if: steps.deltas.outputs.ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/community-appcast.xml
            dist/Goalong-History-macOS-universal-from-*.delta
            dist/release-manifest.json
            dist/delta-release-manifest.json
            dist/delta-generation.json
      - name: Retain prepared generation
        if: steps.deltas.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Deltas-${{ github.run_id }}
          path: |
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal-from-*.delta
            dist/community-appcast.xml
            dist/release-manifest.json
            dist/delta-release-manifest.json
            dist/delta-generation.json
          retention-days: 3

  publish-deltas:
    needs: [prepare-deltas, promote-prepared, publish-latest-main]
    if: always() && needs.prepare-deltas.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: goalong-history-feed-writer
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GODEBUG: http2client=0
      RELEASE_TAG: ${{ needs.promote-prepared.outputs.tag || needs.publish-latest-main.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Goalong-Deltas-${{ github.run_id }}
          path: dist
      - name: Commit eligible delta generation through the sole feed writer
        run: python3 scripts/deferred_release_deltas.py publish "$RELEASE_TAG"
