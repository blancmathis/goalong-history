name: PR fast gate

# T-058 (2026-11-12): the only required PR check, ~1 min wall time on a Linux runner.
# Heavy checks run after the merge on main and nightly; publication requires them green
# on the exact main commit (continuous-release.yml → scripts/wait_main_gates.py).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scripts, policies and privacy audit
        run: bash scripts/fast_gate.sh

