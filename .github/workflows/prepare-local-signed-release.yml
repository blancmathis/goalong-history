name: Prepare universal archive for local signing

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve version
        id: version
        run: ./scripts/resolve_rolling_version.sh "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Test update policy and installers
        run: |
          python3 scripts/test_update_policy.py
          python3 scripts/test_release_publication_policy.py
          bash scripts/test_public_install_safety.sh
          bash scripts/test_install_from_source_safety.sh
          bash scripts/test_update_verification.sh
      - name: Test source and actual relaunch protocol
        run: |
          xcrun swift test
          bash scripts/test_permission_relaunch.sh
          bash scripts/audit_privacy_boundaries.sh
      - name: Build universal staging app
        env:
          LOCALHISTORY_VERSION: ${{ steps.version.outputs.value }}
          LOCALHISTORY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: 1
          LOCALHISTORY_CODESIGN_IDENTITY: '-'
          LOCALHISTORY_RUN_TESTS: 0
          LOCALHISTORY_ARCHS: arm64 x86_64
          LOCALHISTORY_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY || vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          ./scripts/build_app.sh
          ditto -c -k --keepParent --norsrc "dist/Goalong History.app" dist/Goalong-History-macOS-universal.zip
          shasum -a 256 dist/Goalong-History-macOS-universal.zip > dist/staging-sha256.txt
      - name: Upload staging archive only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Unsigned-Universal-${{ github.sha }}
          path: |
            dist/Goalong-History-macOS-universal.zip
            dist/staging-sha256.txt
          retention-days: 3
      - name: Explain local signing handoff
        run: |
          echo 'Universal signing input prepared and tested. This is not a published update.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The owner can sign locally with scripts/publish_local_release.sh --run-id RUN_ID --publish. No signing key is exported.' >> "$GITHUB_STEP_SUMMARY"
