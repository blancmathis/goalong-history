name: T-046 evidence

# Evidence runs for T-046 on a draft PR that is never merged (the file on main would be fine, but a push
# to main starts continuous-release). The app under test is the PR head; no change under Sources/ or Tests/.
# Artifacts: retention 1 day, at most about 250 MB per run. Download them at once with
#   gh run download <id> -R blancmathis/goalong-history
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t046-evidence-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # T-046 C2: coverage of the PR head (draft, never merged).
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: |
          sw_vers
          xcrun swift --version
      - name: Tests with coverage (full suite, then the three make test-ui groups)
        env:
          TZ: Europe/Paris
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/cov" "$RUNNER_TEMP/ui"
          out="$RUNNER_TEMP/ui"
          prof() { cp "$(find .build -path '*codecov/default.profdata' | head -1)" "$RUNNER_TEMP/cov/$1.profdata"; }
          export GOALONG_TEST_HOME="$RUNNER_TEMP/home-full" CFFIXED_USER_HOME="$RUNNER_TEMP/home-full"
          mkdir -p "$GOALONG_TEST_HOME"
          xcrun swift test --disable-keychain --enable-code-coverage 2>&1 | tee "$RUNNER_TEMP/cov/test-full.log" | tail -n 40
          echo "full suite exit ${PIPESTATUS[0]}" >> "$RUNNER_TEMP/cov/exit-codes.txt"
          prof full
          run_group() { # name home-prefix classes
            local g; g="$(mktemp -d "/tmp/$2-XXXXXX")"
            (
              export GOALONG_TEST_HOME="$g" CFFIXED_USER_HOME="$g"
              export GOALONG_BRAND_TEST_HOME="$g" GOALONG_SHARING_TEST_HOME="$g"
              export GOALONG_BRAND_SNAPSHOTS="$out/brand" GOALONG_DESIGN_AUDIT="$out/design-audit" GOALONG_SHARING_SNAPSHOTS="$out/sharing"
              for pair in BRAISE:braise AMBIANCE:ambiance CONCENTRATION_HUB:concentration-hub BLOCKING:blocking \
                ANALYTICS:analytics JEV_CONTEXT:jev-context JEV_EFFECTS:jev-effects MENUBAR:menubar \
                CONCENTRATION:concentration TIMER:timer; do
                mkdir -p "$out/${pair#*:}"; export "GOALONG_${pair%%:*}_SNAPSHOTS=$out/${pair#*:}"
              done
              mkdir -p "$out/brand" "$out/design-audit" "$out/sharing" "$out/focus-ui"
              export GOALONG_FOCUS_UI_TESTS=1 GOALONG_FOCUS_UI_SNAPSHOT="$out/focus-ui/disclosures-expanded.png" GOALONG_BLOCKING_UI_TESTS=1
              xcrun swift test --disable-keychain --enable-code-coverage --filter "$3" 2>&1 | tee "$RUNNER_TEMP/cov/test-$1.log" | tail -n 20
              exit "${PIPESTATUS[0]}"
            )
            echo "group $1 exit $?" >> "$RUNNER_TEMP/cov/exit-codes.txt"
            prof "$1"
          }
          run_group brand goalong-brand 'GoalongBrandRenderingTests|GoalongTrustRenderingTests|GoalongDesignAuditRenderingTests|GoalongControlsInteractionTests'
          run_group sharing goalong-sharing-home 'GoalongWebsiteSharingRenderingTests'
          run_group other goalong-test 'BraisePageRenderingTests|AmbiancePageRenderingTests|ConcentrationHubRenderingTests|BlockingPageRenderingTests|GoalongAnalyticsRenderingTests|JevProcrastinationRenderingTests|JevEffectsRenderingTests|GoalongDisclosureInteractionTests|MenuBarPanelRenderingTests|BlockingActivationRegressionTests|ConcentrationRenderingTests|BlockingTimerTests'
          cat "$RUNNER_TEMP/cov/exit-codes.txt"
          exit 0
      - name: Merge profiles, report and lcov (Tests/ excluded)
        run: |
          cov="$RUNNER_TEMP/cov"
          xcrun llvm-profdata merge -sparse "$cov"/*.profdata -o "$cov/merged.profdata"
          bin="$(find .build -path '*debug/*.xctest/Contents/MacOS/*' -type f | head -1)"
          echo "binary: $bin"
          xcrun llvm-cov report "$bin" -instr-profile "$cov/merged.profdata" -ignore-filename-regex='/Tests/|/\.build/' > "$cov/report.txt"
          xcrun llvm-cov export -format=lcov "$bin" -instr-profile "$cov/merged.profdata" -ignore-filename-regex='/Tests/|/\.build/' > "$cov/coverage.lcov"
          gzip -9 "$cov/coverage.lcov"
          tail -n 3 "$cov/report.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$cov"/*.profdata
          du -sh "$cov"
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t046-coverage-${{ github.run_number }}
          path: ${{ runner.temp }}/cov
          retention-days: 1

