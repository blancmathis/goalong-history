name: T-046 evidence

# Evidence runs for T-046 on a draft PR that is never merged (the file on main would be fine, but a push
# to main starts continuous-release). The app under test is the PR head; no change under Sources/ or Tests/.
# Artifacts: retention 1 day, at most about 250 MB per run. Download them at once with
#   gh run download <id> -R blancmathis/goalong-history
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t046-evidence-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    # L1 done (run 40955827987); L3 pushes run only the e2e shards. A dispatch (file on main) reruns these two.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: |
          sw_vers
          xcrun swift --version
      - name: Render the gallery
        run: make gallery SHARDS=3
      - name: Collect PNGs
        run: |
          run="$(readlink -f qa/gallery/latest)"
          mkdir -p "$RUNNER_TEMP/gallery"
          cp -R "$run"/. "$RUNNER_TEMP/gallery/"
          find "$RUNNER_TEMP/gallery" -name '*.png' | wc -l
          du -sh "$RUNNER_TEMP/gallery"
      - name: Upload gallery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t046-gallery-${{ github.run_number }}
          path: ${{ runner.temp }}/gallery
          retention-days: 1

  coverage:
    # L1 done (run 40955827987); L3 pushes run only the e2e shards. A dispatch (file on main) reruns these two.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Environment
        run: |
          sw_vers
          xcrun swift --version
      - name: Tests with coverage (full suite, then the three make test-ui groups)
        env:
          TZ: Europe/Paris
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/cov" "$RUNNER_TEMP/ui"
          out="$RUNNER_TEMP/ui"
          prof() { cp "$(find .build -path '*codecov/default.profdata' | head -1)" "$RUNNER_TEMP/cov/$1.profdata"; }
          export GOALONG_TEST_HOME="$RUNNER_TEMP/home-full" CFFIXED_USER_HOME="$RUNNER_TEMP/home-full"
          mkdir -p "$GOALONG_TEST_HOME"
          xcrun swift test --disable-keychain --enable-code-coverage 2>&1 | tee "$RUNNER_TEMP/cov/test-full.log" | tail -n 40
          echo "full suite exit ${PIPESTATUS[0]}" >> "$RUNNER_TEMP/cov/exit-codes.txt"
          prof full
          run_group() { # name home-prefix classes
            local g; g="$(mktemp -d "/tmp/$2-XXXXXX")"
            (
              export GOALONG_TEST_HOME="$g" CFFIXED_USER_HOME="$g"
              export GOALONG_BRAND_TEST_HOME="$g" GOALONG_SHARING_TEST_HOME="$g"
              export GOALONG_BRAND_SNAPSHOTS="$out/brand" GOALONG_DESIGN_AUDIT="$out/design-audit" GOALONG_SHARING_SNAPSHOTS="$out/sharing"
              for pair in BRAISE:braise AMBIANCE:ambiance CONCENTRATION_HUB:concentration-hub BLOCKING:blocking \
                ANALYTICS:analytics JEV_CONTEXT:jev-context JEV_EFFECTS:jev-effects MENUBAR:menubar \
                CONCENTRATION:concentration TIMER:timer; do
                mkdir -p "$out/${pair#*:}"; export "GOALONG_${pair%%:*}_SNAPSHOTS=$out/${pair#*:}"
              done
              mkdir -p "$out/brand" "$out/design-audit" "$out/sharing" "$out/focus-ui"
              export GOALONG_FOCUS_UI_TESTS=1 GOALONG_FOCUS_UI_SNAPSHOT="$out/focus-ui/disclosures-expanded.png" GOALONG_BLOCKING_UI_TESTS=1
              xcrun swift test --disable-keychain --enable-code-coverage --filter "$3" 2>&1 | tee "$RUNNER_TEMP/cov/test-$1.log" | tail -n 20
              exit "${PIPESTATUS[0]}"
            )
            echo "group $1 exit $?" >> "$RUNNER_TEMP/cov/exit-codes.txt"
            prof "$1"
          }
          run_group brand goalong-brand 'GoalongBrandRenderingTests|GoalongTrustRenderingTests|GoalongDesignAuditRenderingTests|GoalongControlsInteractionTests'
          run_group sharing goalong-sharing-home 'GoalongWebsiteSharingRenderingTests'
          run_group other goalong-test 'BraisePageRenderingTests|AmbiancePageRenderingTests|ConcentrationHubRenderingTests|BlockingPageRenderingTests|GoalongAnalyticsRenderingTests|JevProcrastinationRenderingTests|JevEffectsRenderingTests|GoalongDisclosureInteractionTests|MenuBarPanelRenderingTests|BlockingActivationRegressionTests|ConcentrationRenderingTests|BlockingTimerTests'
          cat "$RUNNER_TEMP/cov/exit-codes.txt"
          exit 0
      - name: Merge profiles, report and lcov (Tests/ excluded)
        run: |
          cov="$RUNNER_TEMP/cov"
          xcrun llvm-profdata merge -sparse "$cov"/*.profdata -o "$cov/merged.profdata"
          bin="$(find .build -path '*debug/*.xctest/Contents/MacOS/*' -type f | head -1)"
          echo "binary: $bin"
          xcrun llvm-cov report "$bin" -instr-profile "$cov/merged.profdata" -ignore-filename-regex='/Tests/|/\.build/' > "$cov/report.txt"
          xcrun llvm-cov export -format=lcov "$bin" -instr-profile "$cov/merged.profdata" -ignore-filename-regex='/Tests/|/\.build/' > "$cov/coverage.lcov"
          gzip -9 "$cov/coverage.lcov"
          tail -n 3 "$cov/report.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$cov"/*.profdata
          du -sh "$cov"
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t046-coverage-${{ github.run_number }}
          path: ${{ runner.temp }}/cov
          retention-days: 1


  e2e:
    # L3: the 1027 rows of qa/e2e/t046-rows.tsv in shards S1-S4 (S2 and S3 cut in slices), one runner each.
    # A pull_request run (workflow_dispatch cannot run a file that is not on main). App = the PR head,
    # whose Sources/ is 973ff6a = t046/ui-int (checked in summary.txt).
    if: github.event_name == 'pull_request' && (github.head_ref == 't046/evidence' || github.head_ref == 't046/evidence-ui' || github.head_ref == 't046/evidence-ui2')
    runs-on: macos-15
    timeout-minutes: ${{ matrix.shard == 'S4' && 330 || 150 }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # L3n lot 2: Blocage rows only (SB, with the Blocage seed).
          - { shard: SB, slice: 1/2 }
          - { shard: SB, slice: 2/2 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build Goalong Dev (debug, ad-hoc signed, updates and server off)
        # L3m: S4 runs too (its 4 background rows are in t046-only.txt); an empty slice stops before the app.
        env:
          LOCALHISTORY_CODESIGN_IDENTITY: '-'
          LOCALHISTORY_APP_NAME: Goalong Dev
          LOCALHISTORY_EXECUTABLE_NAME: Goalong History Dev
          LOCALHISTORY_DISPLAY_NAME: Goalong Dev
          LOCALHISTORY_BUNDLE_NAME: Goalong Dev
          LOCALHISTORY_BUNDLE_ID: ai.goalong.localhistory.dev
          LOCALHISTORY_DEV_DATA_MODE: fresh
          LOCALHISTORY_DEV_SERVER: 'off'
          LOCALHISTORY_DEV_SOURCE_BRANCH: ${{ github.head_ref }}
          LOCALHISTORY_BUILD_CONFIGURATION: debug
          LOCALHISTORY_DEVELOPMENT_BUILD: '1'
          LOCALHISTORY_DISABLE_UPDATES: '1'
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: '0'
          LOCALHISTORY_RUN_TESTS: '0'
          LOCALHISTORY_PARALLEL_ARCHS: '0'
          LOCALHISTORY_BUILD_JOBS: '4'
        run: |
          LOCALHISTORY_DEV_SOURCE_COMMIT="$(git rev-parse --short HEAD)"; LOCALHISTORY_ARCHS="$(uname -m)"
          export LOCALHISTORY_DEV_SOURCE_COMMIT LOCALHISTORY_ARCHS LOCALHISTORY_OUTPUT_DIR="$RUNNER_TEMP/app"
          ./scripts/build_app.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/build.log"; exit 1; }
          ls "$RUNNER_TEMP/app"
      - name: Drive the rows of ${{ matrix.shard }} ${{ matrix.slice }}
        # L3m: S4 runs too (its 4 background rows are in t046-only.txt); an empty slice stops before the app.
        timeout-minutes: ${{ matrix.shard == 'S4' && 310 || 125 }}
        run: qa/e2e/t046_shard.sh "$RUNNER_TEMP/app/Goalong Dev.app" "$RUNNER_TEMP/e2e" "${{ matrix.shard }}" "${{ matrix.slice }}" 2>&1 | tee "$RUNNER_TEMP/raw.log" | tail -n 80
      - name: Summary
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          cp "$RUNNER_TEMP/raw.log" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/e2e/" 2>/dev/null || true
          tail -n 3 "$RUNNER_TEMP/e2e/summary.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/e2e" || true
      - name: Upload rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t046-e2e-${{ matrix.shard }}-${{ strategy.job-index }}-${{ github.run_number }}
          path: ${{ runner.temp }}/e2e
          retention-days: 1
