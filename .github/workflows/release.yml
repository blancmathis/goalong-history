name: Community macOS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: goalong-history-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PRODUCT: Goalong History
      BUNDLE_ID: ai.goalong.localhistory
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare stable code-signing identity
        env:
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/import_release_signing_identity.sh

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/resolve_rolling_version.sh "$GITHUB_RUN_NUMBER" | grep '^build=' >> "$GITHUB_OUTPUT"

      - name: Build universal Community app
        env:
          LOCALHISTORY_VERSION: ${{ steps.version.outputs.value }}
          LOCALHISTORY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          LOCALHISTORY_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY || vars.SPARKLE_PUBLIC_ED_KEY }}
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: 1
          LOCALHISTORY_ARCHS: arm64 x86_64
          LOCALHISTORY_RUN_TESTS: 1
          LOCALHISTORY_CODESIGN_IDENTITY: ${{ env.LOCALHISTORY_CODESIGN_IDENTITY }}
        run: ./scripts/build_app.sh

      - name: Verify Community bundle
        env:
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: 1
        run: |
          set -euo pipefail
          APP="dist/Goalong History.app"
          lipo -info "$APP/Contents/MacOS/Goalong History"
          lipo "$APP/Contents/MacOS/Goalong History" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=4 "$APP"
          bash scripts/verify_release_identity.sh "$APP"
          ./scripts/verify_local_bundle.sh

      - name: Create Community DMG and ZIP
        run: |
          set -euo pipefail
          brew install create-dmg
          env -u LOCALHISTORY_CODESIGN_IDENTITY ./scripts/package_release.sh

      - name: Generate auditable release inventory
        run: |
          python3 scripts/generate_security_artifacts.py \
            --app "dist/Goalong History.app" \
            --edition unified \
            --output-dir dist \
            --include-release-artifacts
          python3 scripts/verify_security_capabilities.py \
            --manifest dist/security-capabilities.json \
            --app "dist/Goalong History.app" \
            --edition unified

      - name: Attest Community release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: Goalong History ${{ steps.version.outputs.value }} Community Build
          body: |
            Free Community Build of Goalong History `${{ steps.version.outputs.value }}`, built from `${{ github.sha }}`.

            This build keeps a pinned, stable Apple Development code-signing identity but is not Apple-notarized. On first launch, macOS may require **System Settings → Privacy & Security → Open Anyway**. Never disable Gatekeeper globally.

            Verify the SHA-256 file and `release-manifest.json`. GitHub also publishes a Sigstore-backed provenance attestation: `gh attestation verify <downloaded-file> --repo blancmathis/goalong-history`.

            This installer uses the same signed Community main update channel. Installation is user-approved; automatic checks can be disabled in Settings.

            Updates preserve the pinned signing identity. Migration from legacy ad-hoc builds may require a final macOS approval. Existing history and settings are preserved.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            dist/Goalong-History-macOS-universal.dmg
            dist/Goalong-History-macOS-universal.dmg.sha256
            dist/Goalong-History-macOS-universal.zip
            dist/Goalong-History-macOS-universal.zip.sha256
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json

      - name: Remove temporary signing keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/goalong-release-signing.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/goalong-release-signing.p12"
