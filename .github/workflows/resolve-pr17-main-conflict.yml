name: Resolve PR 17 main conflict

on:
  push:
    branches:
      - agent/computer-history-upgrade

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/computer-history-upgrade
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          rm -f .github/workflows/resolve-pr17-main-conflict.yml
          git add -A
          git commit -m "Merge current main into Computer History upgrade"
          git push origin HEAD:agent/computer-history-upgrade
