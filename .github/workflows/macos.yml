name: macOS quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          xcrun swift --version

      - name: Validate scripts
        run: |
          bash -n Install.command Uninstall.command install.sh uninstall.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Privacy-boundary and dependency audit
        run: ./scripts/audit_privacy_boundaries.sh

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          set +e
          xcrun swift test 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [[ $STATUS -ne 0 ]]; then
            if grep -Eq "AppAttestManager\.swift:[0-9]+:[0-9]+: (error|fatal error):|error: no such module 'DeviceCheck'|error: cannot find 'DCAppAttestService'" "$LOG"; then
              xcrun swift test -Xswiftc -DLOCALHISTORY_NO_APP_ATTEST
            else
              exit "$STATUS"
            fi
          fi

      - name: Build installable app bundle
        env:
          LOCALHISTORY_VERSION: 0.4.0-ci
          LOCALHISTORY_BUILD_NUMBER: ${{ github.run_number }}
          LOCALHISTORY_RUN_TESTS: 0
          LOCALHISTORY_ARCHS: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
          # CI-only 32-byte public key. Production releases inject the real EdDSA public key secret.
          LOCALHISTORY_SPARKLE_PUBLIC_ED_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: ./scripts/build_app.sh

      - name: Validate bundle and Sparkle integration
        env:
          LOCALHISTORY_REQUIRE_SPARKLE_CONFIGURED: 1
        run: |
          plutil -lint dist/LocalHistory.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 dist/LocalHistory.app
          test "$(defaults read "$PWD/dist/LocalHistory.app/Contents/Info" CFBundleIdentifier)" = "ai.goalong.localhistory"
          ./scripts/verify_sparkle_bundle.sh

      - name: Package smoke test
        run: |
          ./scripts/package_release.sh
          test -s dist/LocalHistory-macOS-universal.zip
          test -s dist/LocalHistory-macOS-universal.dmg

      - name: Upload CI app
        uses: actions/upload-artifact@v4
        with:
          name: LocalHistory-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/LocalHistory.app
            dist/LocalHistory-macOS-universal.zip
          retention-days: 7
