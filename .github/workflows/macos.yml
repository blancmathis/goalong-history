name: macOS quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Environment
        run: |
          sw_vers
          xcrun swift --version

      - name: Validate scripts
        run: |
          bash -n Install.command Uninstall.command install.sh uninstall.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m py_compile \
            scripts/check_computer_history_answer.py \
            scripts/check_computer_history_memory.py \
            scripts/generate_security_artifacts.py \
            scripts/probe_computer_history_parity.py \
            scripts/verify_security_capabilities.py \
            scripts/test_probe_computer_history_parity.py \
            scripts/local_auto_deploy.py \
            scripts/install_local_auto_deploy.py \
            scripts/local_deploy_policy.py \
            scripts/authenticated_release_state.py \
            scripts/deferred_release_deltas.py \
            scripts/verify_cli_plist.py
          bash scripts/test_check_computer_history_memory.sh
          bash scripts/test_probe_computer_history_parity.sh
          bash scripts/test_public_install_safety.sh
          bash scripts/test_install_from_source_safety.sh
          bash scripts/test_install_cli_link.sh
          bash scripts/test_uninstall_and_quit.sh
          bash scripts/test_release_signing_policy.sh
          bash scripts/test_verify_published_update_feed.sh
          xcrun swiftc -typecheck scripts/verify_update_archive.swift
          python3 scripts/test_update_policy.py
          python3 scripts/test_permission_requirement_policy.py
          python3 scripts/test_release_publication_policy.py
          python3 scripts/test_deferred_release_deltas.py
          python3 scripts/test_background_continuity.py
          python3 scripts/test_prepare_presigned_release.py
          python3 scripts/test_site_submission_policy.py
          bash scripts/test_validate_computer_history_upgrade_safety.sh
          bash scripts/validate_computer_history_parity.sh --help >/dev/null

      - name: Cryptographic update verification
        run: bash scripts/test_update_verification.sh

      - name: Privacy-boundary and dependency audit
        run: ./scripts/audit_privacy_boundaries.sh

      - name: Tests
        shell: bash
        env:
          GOALONG_TEST_HOME: ${{ runner.temp }}/goalong-test-home
          CFFIXED_USER_HOME: ${{ runner.temp }}/goalong-test-home
        run: |
          set -euo pipefail
          mkdir -p "$GOALONG_TEST_HOME"
          LOG="$RUNNER_TEMP/swift-test.log"
          set +e
          xcrun swift test 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [[ $STATUS -ne 0 ]]; then
            if grep -Eq "AppAttestManager\.swift:[0-9]+:[0-9]+: (error|fatal error):|error: no such module 'DeviceCheck'|error: cannot find 'DCAppAttestService'" "$LOG"; then
              xcrun swift test -Xswiftc -DLOCALHISTORY_NO_APP_ATTEST 2>&1 | tee "$LOG"
              STATUS=${PIPESTATUS[0]}
            fi
            [[ $STATUS -eq 0 ]] || exit "$STATUS"
          fi
          # Skipped-test report (also in the job summary). Report only on CI: the hosted runner
          # can skip host-dependent tests (display, WindowServer, Keychain) that this Mac does not.
          # `make test` on the owner's Mac is strict.
          python3 scripts/skip_report.py "$LOG" --report-only

      - name: Skipped-test report and leaked-preference script self tests
        run: |
          bash scripts/test_skip_report.sh
          bash scripts/test_clean_leaked_test_prefs.sh

      - name: Isolated-HOME recording and navigation tests
        run: ./scripts/test_isolated_home.sh --skip-build

      - name: Goalong Dev control tests (no build, no launch)
        run: bash scripts/test_dev_app.sh

      - name: Release and Goalong Dev identity refusals (skips without the signing key)
        run: bash scripts/test_stable_release_identity.sh

      - name: Exercise full-row disclosure interactions
        timeout-minutes: 2
        run: |
          mkdir -p qa/local-analytics
          GOALONG_FOCUS_UI_TESTS=1 GOALONG_FOCUS_UI_SNAPSHOT="$PWD/qa/local-analytics/disclosures-expanded.png" \
            swift test --skip-build --filter GoalongDisclosureInteractionTests

      - name: Exercise the blocking activation regression
        timeout-minutes: 3
        run: |
          LOG="$(mktemp)"
          GOALONG_BLOCKING_UI_TESTS=1 HOME="$(mktemp -d /tmp/goalong-test-XXXX)" \
            swift test --skip-build --filter BlockingActivationRegressionTests 2>&1 | tee "$LOG"
          # A skipped test must fail the gate, so the env opt-in cannot quietly switch it off.
          if grep -q "skipped" "$LOG" || ! grep -q "Executed 1 test, with 0 failures" "$LOG"; then
            echo "BlockingActivationRegressionTests did not run" >&2
            exit 1
          fi

      - name: Render local analytics with synthetic data
        run: |
          mkdir -p qa/local-analytics
          GOALONG_ANALYTICS_SNAPSHOTS="$PWD/qa/local-analytics" \
            swift test --skip-build --filter GoalongAnalyticsRenderingTests \
            2>&1 | tee qa/local-analytics/native-render.log

      - name: Verify reminder text and strong-effect controls
        timeout-minutes: 2
        run: |
          GOALONG_JEV_EFFECTS_SNAPSHOTS="$PWD/qa/local-analytics" \
            swift test --skip-build --filter JevEffectsRenderingTests

      - name: Upload local analytics evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Analytics-UI-${{ github.sha }}
          path: qa/local-analytics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Exercise real permission relaunches
        run: bash scripts/test_permission_relaunch.sh

      - name: Render isolated native user journeys
        run: bash scripts/verify_brand_ui.sh qa/journey-ci

      - name: Upload native journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-Journey-UI-${{ github.sha }}
          path: |
            qa/journey-ci/*.png
            qa/journey-ci/runtime-results.txt
            qa/journey-ci/native-render.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Timezone regression checks
        run: |
          for timezone in UTC America/Chicago Europe/Paris; do
            TZ="$timezone" xcrun swift test --skip-build --filter GoalongSiteExportTests
          done

      - name: Build installable app bundle
        env:
          LOCALHISTORY_VERSION: 0.6.0-ci
          LOCALHISTORY_BUILD_NUMBER: ${{ github.run_number }}
          LOCALHISTORY_APP_ENTITLEMENTS: Distribution/GoalongHistory.entitlements
          LOCALHISTORY_RUN_TESTS: 0
          LOCALHISTORY_ARCHS: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: ./scripts/build_app.sh

      - name: Validate the single security-first bundle
        run: |
          plutil -lint "dist/Goalong History.app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "dist/Goalong History.app"
          test "$(defaults read "$PWD/dist/Goalong History.app/Contents/Info" CFBundleIdentifier)" = "ai.goalong.localhistory"
          LOCALHISTORY_APP_PATH="dist/Goalong History.app" \
            ./scripts/verify_local_bundle.sh
          python3 scripts/verify_security_capabilities.py \
            --manifest dist/security-capabilities.json \
            --app "dist/Goalong History.app" \
            --edition unified
          bash scripts/test_goalong_cli.sh \
            "dist/Goalong History.app/Contents/MacOS/goalong"

      - name: Package smoke test
        run: |
          ./scripts/package_release.sh
          test -s dist/Goalong-History-macOS-universal.zip
          test -s dist/Goalong-History-macOS-universal.dmg

      - name: Upload CI app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Goalong-History-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/Goalong History.app
            dist/Goalong-History-macOS-universal.zip
            dist/security-capabilities.json
            dist/sbom.spdx.json
            dist/release-manifest.json
          retention-days: 7

      - name: Record successful exact-checkout gate
        run: python3 scripts/write_gate_receipt.py
      - name: Retain exact-checkout gate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Goalong-Gate-${{ github.job }}-${{ github.run_attempt }}
          path: gate-receipt.json
          if-no-files-found: error
          retention-days: 7
