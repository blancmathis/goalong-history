name: Bootstrap Computer History upgrade

on:
  push:
    branches:
      - agent/computer-history-upgrade

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/computer-history-upgrade

      - name: Reconstruct validated upgrade bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final/part*.bin > /tmp/goalong-history-upgrade.zip
          test "$(wc -c < /tmp/goalong-history-upgrade.zip | tr -d ' ')" = "139141"
          echo "c21f2eb06098499711e3275f574a1178a39451910f8e92fc8c0d7b77462b9645  /tmp/goalong-history-upgrade.zip" | shasum -a 256 -c -
          rm -rf /tmp/goalong-history-upgrade
          mkdir -p /tmp/goalong-history-upgrade
          unzip -q /tmp/goalong-history-upgrade.zip -d /tmp/goalong-history-upgrade

      - name: Apply guarded source upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/goalong-history-upgrade/goalong-history-upgrade/apply_upgrade.py --repo "$GITHUB_WORKSPACE" --apply

      - name: Remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-computer-history-upgrade.yml
          rm -rf .goalong-history-backup

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          swift test
          ./scripts/audit_privacy_boundaries.sh
          ./scripts/build_app_core.sh

      - name: Commit real upgrade only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Upgrade capture health and local history"
          git push origin HEAD:agent/computer-history-upgrade
