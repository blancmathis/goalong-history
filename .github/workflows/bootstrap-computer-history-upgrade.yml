name: Bootstrap Computer History upgrade

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: computer-history-bootstrap-pr17
  cancel-in-progress: true

jobs:
  apply-upgrade:
    if: github.head_ref == 'agent/computer-history-upgrade'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/computer-history-upgrade

      - name: Reconstruct validated upgrade bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final/part*.bin > /tmp/goalong-history-upgrade.zip
          test "$(wc -c < /tmp/goalong-history-upgrade.zip | tr -d ' ')" = "139141"
          echo "c21f2eb06098499711e3275f574a1178a39451910f8e92fc8c0d7b77462b9645  /tmp/goalong-history-upgrade.zip" | shasum -a 256 -c -
          rm -rf /tmp/goalong-history-upgrade
          mkdir -p /tmp/goalong-history-upgrade
          unzip -q /tmp/goalong-history-upgrade.zip -d /tmp/goalong-history-upgrade

      - name: Apply guarded source upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/goalong-history-upgrade/goalong-history-upgrade/apply_upgrade.py --repo "$GITHUB_WORKSPACE" --apply

      - name: Fix Security framework compatibility
        shell: bash
        run: |
          cat > Sources/LocalHistoryApp/BuildIdentityReader.swift <<'SWIFT'
          #if os(macOS)
              import Foundation
              import LocalHistoryCore
              import Security

              enum BuildIdentityReader {
                  static func current(bundle: Bundle = .main) -> CaptureBuildIdentity {
                      let bundleIdentifier = bundle.bundleIdentifier ?? "ai.goalong.localhistory"
                      let version = bundle.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String
                      let buildNumber = bundle.object(forInfoDictionaryKey: "CFBundleVersion") as? String
                      let executablePath = bundle.executableURL?.path ?? CommandLine.arguments.first ?? "unknown"

                      var code: SecCode?
                      guard SecCodeCopySelf(SecCSFlags(rawValue: 0), &code) == errSecSuccess, let code else {
                          return fallback(
                              bundleIdentifier: bundleIdentifier,
                              version: version,
                              buildNumber: buildNumber,
                              executablePath: executablePath
                          )
                      }

                      var staticCode: SecStaticCode?
                      guard SecCodeCopyStaticCode(code, SecCSFlags(rawValue: 0), &staticCode) == errSecSuccess,
                          let staticCode
                      else {
                          return fallback(
                              bundleIdentifier: bundleIdentifier,
                              version: version,
                              buildNumber: buildNumber,
                              executablePath: executablePath
                          )
                      }

                      var rawInformation: CFDictionary?
                      let flags = SecCSFlags(rawValue: kSecCSSigningInformation)
                      guard SecCodeCopySigningInformation(staticCode, flags, &rawInformation) == errSecSuccess,
                          let information = rawInformation as? [String: Any]
                      else {
                          return fallback(
                              bundleIdentifier: bundleIdentifier,
                              version: version,
                              buildNumber: buildNumber,
                              executablePath: executablePath
                          )
                      }

                      let signingIdentifier = information[kSecCodeInfoIdentifier as String] as? String
                      let teamIdentifier = information[kSecCodeInfoTeamIdentifier as String] as? String
                      let unique = information[kSecCodeInfoUnique as String] as? Data
                      let certificates = information[kSecCodeInfoCertificates as String] as? [SecCertificate]
                      var designatedRequirementReference: SecRequirement?
                      let designatedRequirement: String?
                      if SecCodeCopyDesignatedRequirement(
                          staticCode,
                          SecCSFlags(rawValue: 0),
                          &designatedRequirementReference
                      ) == errSecSuccess, let designatedRequirementReference {
                          designatedRequirement = requirementString(designatedRequirementReference)
                      } else {
                          designatedRequirement = nil
                      }

                      let signatureKind: BuildSignatureKind
                      if teamIdentifier != nil {
                          let receipt = bundle.appStoreReceiptURL
                          signatureKind = receipt.map { FileManager.default.fileExists(atPath: $0.path) } == true
                              ? .appStore
                              : .developerID
                      } else if unique != nil, certificates?.isEmpty != false {
                          signatureKind = .adHoc
                      } else if unique != nil {
                          signatureKind = .other
                      } else {
                          signatureKind = .unsigned
                      }

                      return CaptureBuildIdentity(
                          bundleIdentifier: bundleIdentifier,
                          displayVersion: version,
                          buildNumber: buildNumber,
                          executablePath: executablePath,
                          signatureKind: signatureKind,
                          signingIdentifier: signingIdentifier,
                          teamIdentifier: teamIdentifier,
                          codeDirectoryHash: unique?.map { String(format: "%02x", $0) }.joined(),
                          designatedRequirement: designatedRequirement
                      )
                  }

                  private static func requirementString(_ requirement: SecRequirement) -> String? {
                      var text: CFString?
                      guard SecRequirementCopyString(requirement, SecCSFlags(rawValue: 0), &text) == errSecSuccess else {
                          return nil
                      }
                      return text as String?
                  }

                  private static func fallback(
                      bundleIdentifier: String,
                      version: String?,
                      buildNumber: String?,
                      executablePath: String
                  ) -> CaptureBuildIdentity {
                      CaptureBuildIdentity(
                          bundleIdentifier: bundleIdentifier,
                          displayVersion: version,
                          buildNumber: buildNumber,
                          executablePath: executablePath,
                          signatureKind: .unsigned,
                          signingIdentifier: nil,
                          teamIdentifier: nil,
                          codeDirectoryHash: nil,
                          designatedRequirement: nil
                      )
                  }
              }
          #endif
          SWIFT

      - name: Remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-computer-history-upgrade.yml
          rm -rf .goalong-history-backup

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          swift test
          ./scripts/audit_privacy_boundaries.sh
          ./scripts/build_app_core.sh

      - name: Commit real upgrade only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Upgrade capture health and local history"
          git push origin HEAD:agent/computer-history-upgrade
