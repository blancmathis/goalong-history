name: Community signing compatibility
on:
  push:
    paths:
      - 'scripts/test_community_codesign.sh'
      - '.github/workflows/community-signing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: bash scripts/test_community_codesign.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Community-signature-compatibility
          path: |
            qa/community-signing/result.txt
            qa/community-signing/requirement-*.txt
            qa/community-signing/test-public-certificate.pem
            qa/community-signing/probe-*.zip
          retention-days: 7
