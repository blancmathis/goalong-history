name: Apply and validate Jev implementation
on:
  push:
    branches: ['feature/jev-focus-monitor']
    paths: ['.github/workflows/jev-apply.yml']
permissions:
  contents: write
concurrency:
  group: jev-implementation
  cancel-in-progress: false
jobs:
  apply-and-test:
    if: github.repository == 'blancmathis/goalong-history' && github.ref == 'refs/heads/feature/jev-focus-monitor'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Apply hash-verified source patch to the feature branch only
        id: implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          expected_parent = 'ae8eaba6cb1e7b782768bd5859d66cb2dd8bfdfb'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == expected_parent
          changed = subprocess.check_output(['git','diff','--name-only',expected_parent,'HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/jev-apply.yml'], changed
          chunks = [
            '367b333794fd673076fd80790cc563d8edea72c3',
            '73414ca4492106840799dc70c6151294dde896b1',
            '2ba845b58bb2c1c1079c20f903d0a6e7640b0952',
            'b9a53f8d93af8d326e9dba8b93b105626e36d48f',
            '16c8637b488b2f67c9248cf254d3fb9065543b8f',
            'e9f2d173221018c5fe04b5d2cda195151017549e',
          ]
          encoded = b''
          for sha in chunks:
            request = urllib.request.Request('https://api.github.com/repos/blancmathis/goalong-history/git/blobs/' + sha,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response:
              blob = json.load(response)
            assert blob['sha'] == sha and blob['encoding'] == 'base64'
            encoded += base64.b64decode(blob['content'])
          assert len(encoded) == 34680
          patch = lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch) == 105354
          assert hashlib.sha256(patch).hexdigest() == '8df45f679a987ca878600257e70a2119759474323912b14fb8e9a3759d022788'
          subprocess.run(['git','apply','--check','--unidiff-zero','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','.github/workflows/jev-apply.yml','.github/workflows/jev-validation.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: opt-in Jev 15-second focus monitoring, two-window warning and timed breaks'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/jev-focus-monitor'],check=True)
          sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('JEV_IMPLEMENTATION_COMMIT=' + sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('sha='+sha+'\n')
          PY
      - name: Swift compiler and Jev tests
        run: |
          set -o pipefail
          xcrun swift test -j 4 --filter Jev 2>&1 | tee "$RUNNER_TEMP/jev-swift.log"
      - name: Source security and capability policy
        if: always() && steps.implementation.outcome == 'success'
        run: |
          set -o pipefail
          ./scripts/verify_source_security.sh 2>&1 | tee "$RUNNER_TEMP/jev-security.log"
          python3 scripts/test_site_submission_policy.py 2>&1 | tee "$RUNNER_TEMP/jev-policy.log"
      - name: Validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-validation-${{ steps.implementation.outputs.sha }}
          path: ${{ runner.temp }}/jev-*.log
          retention-days: 7
