name: Native brand motion integration

on:
  push:
    branches: [main, motion/integration-20260917]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Privacy boundaries
        run: ./scripts/audit_privacy_boundaries.sh
      - name: Build and test on macOS
        run: swift test
      - name: Native activity, release and reduced-motion rendering
        run: |
          mkdir -p qa/brand-motion
          set +e
          GOALONG_MOTION_SNAPSHOTS="$PWD/qa/brand-motion" swift test --skip-build --filter GoalongMotionRenderingTests >qa/brand-motion/rendering-test.log 2>&1
          result=$?
          tail -n 80 qa/brand-motion/rendering-test.log
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: goalong-native-motion-evidence
          path: qa/brand-motion/
          if-no-files-found: ignore
          retention-days: 7
